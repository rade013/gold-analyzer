<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥇 Gold Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🥇 XAU/USD GOLD ANALYZER</h1>

        <div class="price" id="price">
            Loading...
        </div>

        <div class="live">
            ● LIVE
        </div>

        <div class="card">
            <div class="label">TREND</div>
            <div class="value" id="trend">
                —
            </div>
        </div>

        <div class="card">
            <div class="label">SIGNAL</div>
            <div class="value" id="signal">
                —
            </div>
        </div>

        <div class="card">
            <div class="label">SCORE</div>
            <div class="value" id="score">
                —
            </div>
        </div>

        <div class="signal" id="message">
            Analiziram tržište...
        </div>

    </div>
<script src="analyzer.js?v=2"></script>
</body>
</html>
